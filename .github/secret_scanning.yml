# The prebuilt package ships three vendored copies of @huggingface/transformers -
# `transformers-web.js`, `transformers-node-wasm.js` and `transformers.node-<hash>.js`.
# They have to be there: the plugin's local embeddings import one of them dynamically, and
# without them no runtime loads at all (it is reported as a stale build, which it is not).
#
# Their model-class tables contain a 32-character Hugging Face class name beginning with the
# vendor prefix "Mistral" - a *model class*, not an API key - which the Mistral-key detector
# cannot tell apart from a real credential. Excluding exactly these three paths keeps that
# false positive out of secret scanning and push protection, so the prebuilt can carry the
# runtime it needs.
#
# Nothing else in this repository belongs on this list. The staging workflow's own guard
# (`.github/workflows/magic-context.yml`) still fails the build if any *other* staged file
# matches a key shape, so narrowing this file is not how a secret would get through.
#
# (This file does not spell the identifier out, for the same reason the workflow's guard
# exists: the string itself matches the pattern.)
paths-ignore:
  - "packages/magic-context/transformers-web.js"
  - "packages/magic-context/transformers-node-wasm.js"
  - "packages/magic-context/transformers.node-*.js"
