name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Prebuilt magic-context is current
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const stamp = JSON.parse(fs.readFileSync("packages/magic-context/package.json", "utf8"))
              .builtFrom?.commit;
            let head = "";
            try {
              head = execFileSync("git", ["-C", "vendor/magic-context", "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            } catch {
              console.log("submodule not checked out; skipping (clone with --recurse-submodules to check)");
              process.exit(0);
            }
            if (!stamp) throw new Error("packages/magic-context/package.json has no builtFrom.commit");
            const pluginPkg = "vendor/magic-context/packages/pi-plugin/package.json";
            if (fs.existsSync(pluginPkg)) {
              const want = JSON.parse(fs.readFileSync(pluginPkg, "utf8")).version;
              const got = JSON.parse(fs.readFileSync("packages/magic-context/package.json", "utf8")).version;
              if (want !== got) throw new Error("prebuilt package version " + got + " != plugin version " + want);
            }
            if (stamp !== head) {
              throw new Error(
                "packages/magic-context was built from " + stamp.slice(0, 8) +
                " but the submodule is at " + head.slice(0, 8) +
                ". The magic-context workflow rebuilds it on push to main; " +
                "run it via workflow_dispatch, or rebuild locally with: " +
                "bun run --cwd vendor/magic-context/packages/pi-plugin build");
            }
            console.log("prebuilt package matches submodule " + head.slice(0, 8));
          '

      - name: Root pi manifest resolves
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const entries = pkg.pi?.extensions ?? [];
            if (!entries.length) throw new Error("no pi.extensions in the root manifest");
            let missing = 0;
            for (const e of entries) {
              const ok = fs.existsSync(path.resolve(e));
              console.log((ok ? "  ok   " : "  MISS ") + e);
              if (!ok) missing++;
            }
            if (missing) throw new Error(missing + " manifest entries do not exist");
            console.log(entries.length + " extensions resolvable");
          '
