name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Prebuilt magic-context is current
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const pkgPath = "packages/magic-context/package.json";
            const stamp = read(pkgPath).builtFrom?.commit;
            if (!stamp) throw new Error(pkgPath + " has no builtFrom.commit");
            // Resolve the pin from the commit rather than from the working tree.
            // actions/checkout leaves vendor/magic-context as an empty directory
            // unless it is asked for submodules, and `git -C <empty dir> rev-parse
            // HEAD` does not fail there: it walks up to the superproject and
            // answers with this repository HEAD, so the stamp can never match.
            const pin = execFileSync("git", ["rev-parse", "HEAD:vendor/magic-context"], { encoding: "utf8" }).trim();
            const pluginPkg = "vendor/magic-context/packages/pi-plugin/package.json";
            if (fs.existsSync(pluginPkg)) {
              const want = read(pluginPkg).version;
              const got = read(pkgPath).version;
              if (want !== got) throw new Error("prebuilt package version " + got + " != plugin version " + want);
            }
            if (stamp !== pin) {
              throw new Error(
                "packages/magic-context was built from " + stamp.slice(0, 8) +
                " but vendor/magic-context is pinned at " + pin.slice(0, 8) +
                ". The magic-context workflow rebuilds it on push to main; " +
                "run it via workflow_dispatch, or rebuild locally with: " +
                "bun run --cwd vendor/magic-context/packages/pi-plugin build");
            }
            console.log("prebuilt package matches submodule " + pin.slice(0, 8));
          '

      - name: Root pi manifest resolves
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const entries = pkg.pi?.extensions ?? [];
            if (!entries.length) throw new Error("no pi.extensions in the root manifest");
            let missing = 0;
            for (const e of entries) {
              const ok = fs.existsSync(path.resolve(e));
              console.log((ok ? "  ok   " : "  MISS ") + e);
              if (!ok) missing++;
            }
            if (missing) throw new Error(missing + " manifest entries do not exist");
            console.log(entries.length + " extensions resolvable");
          '
