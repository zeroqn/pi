name: aot-release

# Watches pi's releases, builds, gates, and publishes: the AOT pi host, the Rust client, and the Bun the host
# was compiled with. Nothing here follows Bun on its own schedule.
#
# What it watches
#  - pi releases (github.com/earendil-works/pi). A new version publishes a release tagged `pi-v<version>`,
#    carrying, per platform: `pi-aot` (the AOT host and its assets) and `bun-aot` (the canary archive that
#    host was compiled with). Releases are kept: they are the versions we follow, and our own copy of Bun is
#    what keeps them installable. The Rust client is not here: it has its own stream, `tui-release.yml`, with
#    its own version, because it changes far more often than pi does.
#
# Platforms: `x86_64-linux` and `aarch64-linux`. Darwin is not built: its leg was never able to start (a
# `macos-14` job that reported `cancelled` one second after it was created, with no steps and no runner), and
# nothing about the arm64 Linux leg depends on it. `aarch64-darwin` stays described but unreleased, so a
# Darwin downstream gets no prebuilt and no wrong binary.
#
# Why Bun is copied rather than pointed at: upstream's `canary` assets are replaced daily and the old URLs
# stop working, so a pin that names oven-sh's tag rots. Each release re-pins, downloads the archive it
# verifies by hash, and uploads it; `nix/runtime.nix` prefers that release asset once the manifest carries it.
#
# What must pass before anything publishes: `nix/aot-smoke.sh` (the executable reports the version of its
# manifest, and answers `get_state` over `--mode rpc`) and `tools/harness/smoke_host.py` (the client spawns
# that host, a fake model answers, the answer is painted). A failing gate fails the run and leaves the pin,
# the manifest and the release page untouched.
#
# `--aot` cannot cross-compile ("--aot can't cross-compile. It only builds for the platform it runs on"),
# so every platform builds on its own runner, and the manifest is written only after all of them passed.
#
# Attestation: the artifacts this workflow builds get a GitHub build-provenance attestation, and the pin file
# gets a custom-predicate attestation recording which upstream Bun bytes the release was compiled with.
#
# The publish job pushes with GITHUB_TOKEN, so Settings -> Actions -> General -> Workflow permissions must be
# "Read and write"; a ruleset on main must list the GitHub Actions app as a bypass actor.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to publish; empty derives one from what moved'
        required: false
      pi_ref:
        description: 'pi tag or commit to build; empty takes the latest pi release'
        required: false
      publish:
        description: 'publish, or build and report only'
        type: boolean
        default: false
  schedule:
    # Daily: notice a new pi release. Bun is re-pinned by that release's build, not here.
    - cron: "0 6 * * 1"

concurrency:
  group: aot-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # The flake is in `tui/`, not at the repository root: `nix develop` only finds it from there. Paths below
    # are relative to that directory, which is also where `nix/-` and `tools/harness/` sit.
    defaults:
      run:
        working-directory: tui
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      tag: ${{ steps.decide.outputs.tag }}
      kind: ${{ steps.decide.outputs.kind }}
      pi-ref: ${{ steps.pi.outputs.ref }}
      pi-version: ${{ steps.pi.outputs.version }}
      bun-moved: ${{ steps.bun.outputs.moved }}
      bun-version: ${{ steps.bun.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Latest pi release
        id: pi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          ref="${{ inputs.pi_ref }}"
          if [ -z "$ref" ]; then
            ref="$(gh api repos/earendil-works/pi/releases/latest --jq .tag_name)"
          fi
          version="$(gh api "repos/earendil-works/pi/contents/packages/coding-agent/package.json?ref=$ref" \
            --jq .content | base64 -d | jq -r .version)"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: What the manifest already describes
        id: manifest
        run: |
          set -eu
          version="$(sed -n 's/^      version = "\(.*\)";$/\1/p' nix/manifest.nix 2>/dev/null | head -1 || true)"
          echo "version=${version:-}" >> "$GITHUB_OUTPUT"

      - name: Where the Bun pin stands
        id: bun
        # A report, not a trigger: Bun is adopted by a release build, never on its own schedule. Plain bash,
        # because `nix develop` builds bun-aot and cannot start while the pin is stale; `--check` downloads
        # this platform's archive and hashes it, since upstream replaces canary assets without changing an etag.
        run: |
          set -eu
          set +e
          ./nix/bun-pin-update.sh --check
          status=$?
          set -e
          case "$status" in
          0) moved=false ;;
          10) moved=true ;;
          *) exit "$status" ;;
          esac
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^  version = "\(.*\)";$/\1/p' nix/bun-pin.nix)" >> "$GITHUB_OUTPUT"

      - name: Decide what to build and what to publish
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          PI_VERSION: ${{ steps.pi.outputs.version }}
          PI_REF: ${{ steps.pi.outputs.ref }}
          MANIFEST_VERSION: ${{ steps.manifest.outputs.version }}
          BUN_MOVED: ${{ steps.bun.outputs.moved }}
        run: |
          set -eu
          # Three outcomes: a scheduled run builds and publishes only when pi moved; a dispatch always builds
          # (so the gates can be exercised without publishing), and publishes when `publish` is set.
          build=false
          publish=false
          kind=none
          tag=""
          if [ "$EVENT" = workflow_dispatch ]; then
            build=true
            kind=dispatch
            publish="$INPUT_PUBLISH"
            tag="$INPUT_TAG"
            # A tag is only needed to publish; a dispatch that will not publish has no release name at all.
            if [ -z "$tag" ] && [ "$publish" = true ]; then tag="pi-v$PI_VERSION"; fi
          elif [ "$PI_VERSION" != "$MANIFEST_VERSION" ]; then
            # A new pi release. Bun is re-pinned by this release's build, and travels with it.
            build=true
            publish=true
            kind=pi
            tag="pi-v$PI_VERSION"
          fi
          {
            echo "build=$build"
            echo "publish=$publish"
            echo "kind=$kind"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### aot-release watch"
            echo "- latest pi: $PI_VERSION at $PI_REF"
            echo "- manifest describes: ${MANIFEST_VERSION:-<empty>}"
            echo "- Bun canary moved since the pin: $BUN_MOVED"
            echo "- decision: build=$build publish=$publish kind=$kind tag=${tag:-<none>}"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: watch
    # A dispatch builds even when it will not publish, so the gates can be run without creating a release.
    if: needs.watch.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64-linux
            end-to-end: true
          - runner: ubuntu-24.04-arm
            platform: aarch64-linux
            end-to-end: false
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check out pi
        env:
          PI_REF: ${{ needs.watch.outputs.pi-ref }}
        run: |
          set -eu
          # A tag or a commit both arrive through FETCH_HEAD, which `--branch` cannot do.
          git init -q "$RUNNER_TEMP/pi"
          git -C "$RUNNER_TEMP/pi" remote add origin https://github.com/earendil-works/pi
          git -C "$RUNNER_TEMP/pi" fetch -q --depth 1 origin "$PI_REF"
          git -C "$RUNNER_TEMP/pi" checkout -q FETCH_HEAD

      - name: Move the pin to what upstream serves
        # Before `nix develop`, and in plain bash for the same reason as the watch step. The pin file this
        # writes is committed only by the publish job, and only with a release that passed the gates.
        run: ./nix/bun-pin-update.sh

      - name: Build the AOT host and this platform's manifest entry
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.watch.outputs.tag }}
          MANIFEST_OUT: ${{ runner.temp }}/manifest-entry.nix
        run: |
          set -eu
          nix develop --command aot-release \
            --pi "$RUNNER_TEMP/pi" \
            --stage "$RUNNER_TEMP/release"

      - name: Gate 1 - this host answers its own protocol
        run: |
          set -eu
          nix develop --command aot-smoke \
            --host "$RUNNER_TEMP/release/host" \
            --expect "${{ needs.watch.outputs.pi-version }}"

      - name: Gate 2 - the client drives it through a whole turn
        if: matrix.end-to-end
        # The client is not released here, but it must still be able to drive this host: that is the whole
        # contract between the two streams. Built from source, cached, a couple of minutes.
        run: |
          set -eu
          nix build .#rpi --out-link "$RUNNER_TEMP/rpi"
          nix develop --command python3 tools/harness/smoke_host.py \
            --binary "$RUNNER_TEMP/rpi/bin/rpi" \
            --host "$RUNNER_TEMP/release/host"

      - name: Attest the artifacts this run built
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/host/pi

      - name: Record what the pin claims about upstream Bun
        run: |
          set -eu
          python3 nix/bun-pin-tools.py claim > "$RUNNER_TEMP/bun-claim.json"
          head -5 "$RUNNER_TEMP/bun-claim.json"

      - name: Attest the pin claim
        uses: actions/attest@v2
        with:
          subject-path: tui/nix/bun-pin.nix
          predicate-type: https://github.com/zeroqn/pi/attestation/bun-pin/v1
          predicate-path: ${{ runner.temp }}/bun-claim.json

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/release/*.tar.gz
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/manifest-entry.nix

  publish:
    needs: [watch, build]
    # Runs even when one platform's leg failed, because a platform that passed is installable on its own and
    # the manifest names only the platforms that passed. `cancelled()` still stops it when the run itself was
    # cancelled, and a run that published no platform at all fails below instead of creating an empty release.
    if: ${{ !cancelled() && needs.watch.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: ${{ runner.temp }}/artifacts

      - name: Which platforms passed their gates
        id: platforms
        run: |
          set -eu
          found="$(find "$RUNNER_TEMP/artifacts" -name 'manifest-entry.nix' -printf '%h\n' | xargs -r -n1 basename | sed 's/artifacts-//' | sort | paste -sd, -)"
          if [ -z "$found" ]; then
            echo "no platform produced a manifest entry: every leg failed its gates" >&2
            exit 1
          fi
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Create the release and upload the assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.watch.outputs.tag }}
          PI_VERSION: ${{ needs.watch.outputs.pi-version }}
          BUN_VERSION: ${{ needs.watch.outputs.bun-version }}
          REPO: ${{ github.repository }}
          PLATFORMS: ${{ steps.platforms.outputs.found }}
        run: |
          set -eu
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "pi $PI_VERSION, compiled ahead of time with Bun $BUN_VERSION, and shipped with"
            echo "the Bun archive the host was built with, so this release stays"
            echo "installable after upstream's canary tag moves."
            echo
            echo 'Each asset carries a build-provenance attestation:'
            echo
            echo "    gh attestation verify <asset> --repo $REPO"
            echo
            echo 'nix/bun-pin.nix carries a bun-pin/v1 predicate attestation: the upstream archive hashes'
            echo 'this release was compiled with. That is the pin a downstream build checks.'
          } > "$notes"
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" ||
            echo "release $TAG already exists"
          find "$RUNNER_TEMP/artifacts" \( -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            xargs -0 gh release upload "$TAG" --clobber

      - name: Pin the Bun the release carries, and mark it verified
        env:
          TAG: ${{ needs.watch.outputs.tag }}
          PI_VERSION: ${{ needs.watch.outputs.pi-version }}
        run: |
          set -eu
          # From the manifest entries, not from upstream: the pin must name the archives this release
          # uploads, so it stays true after oven-sh's canary tag moves. The build job's own re-pin is
          # scratch state, gone with its runner.
          python3 nix/bun-pin-tools.py from-entries "$RUNNER_TEMP/artifacts"/*/manifest-entry.nix
          python3 nix/bun-pin-tools.py verified "gh-$TAG" "$PI_VERSION"

      - name: Write nix/manifest.nix from the per-platform entries
        run: |
          set -eu
          {
            echo "{"
            find "$RUNNER_TEMP/artifacts" -name 'manifest-entry.nix' | sort |
              while read -r entry; do cat "$entry"; done
            echo "}"
          } > nix/manifest.nix

      - name: Commit the pin and the manifest
        env:
          PI_VERSION: ${{ needs.watch.outputs.pi-version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/bun-pin.nix nix/manifest.nix
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore(tui): pi $PI_VERSION built with Bun $(sed -n 's/^  version = "\(.*\)";$/\1/p' nix/bun-pin.nix)"
            git push
          fi

      - name: Summary
        env:
          TAG: ${{ needs.watch.outputs.tag }}
          KIND: ${{ needs.watch.outputs.kind }}
          PI_VERSION: ${{ needs.watch.outputs.pi-version }}
        run: |
          set -eu
          {
            echo "### published $TAG ($KIND, pi $PI_VERSION)"
            echo '```nix'
            cat nix/manifest.nix
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
