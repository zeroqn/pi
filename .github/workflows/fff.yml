name: fff

# A push that moves vendor/fff cannot be checked on its own: the prebuilt directory it must match is
# regenerated by CI into a commit of its own. So the rebuild and the checks live in one workflow, and
# `check` waits for `prebuilt` and then reads the tree that was actually rebuilt.
#
# Two workflows cannot express that. A commit pushed with GITHUB_TOKEN does not trigger another
# workflow's `on: push` (only workflow_dispatch and repository_dispatch fire), so a separate check
# workflow would run against the pin bump, fail, and never be re-run against the rebuild commit.
#
# The prebuilt job pushes with GITHUB_TOKEN, so the repo's Settings -> Actions -> General -> Workflow
# permissions must be "Read and write", and if a ruleset protects main it must list the GitHub Actions
# app as a bypass actor - otherwise the push is rejected even though the build succeeded.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize runs of the same ref: two concurrent pushes to main would otherwise both see a stale
# prebuilt and race to commit it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Regenerates packages/pi-fff from the vendor/fff submodule and commits the result back to main. The
  # submodule is the single source of truth; this directory is generated.
  prebuilt:
    # Only main is rebuilt into, and only a push or a dispatch reaches it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rebuilt: ${{ steps.commit.outputs.rebuilt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pin is read from the commit, not the working tree: actions/checkout leaves vendor/fff as an
      # empty directory, and `git -C <empty dir> rev-parse HEAD` does not fail there - it walks up to
      # the superproject and answers with this repository HEAD.
      - name: Is the prebuilt stale?
        id: stale
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const stamp = read("packages/pi-fff/package.json").builtFrom?.commit;
            const pin = execFileSync("git", ["rev-parse", "HEAD:vendor/fff"], { encoding: "utf8" }).trim();
            const stale = stamp !== pin;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "stale=" + stale + "\n");
            console.log(stale
              ? "stale: built from " + String(stamp).slice(0, 8) + ", pinned at " + pin.slice(0, 8)
              : "current: prebuilt package matches submodule " + pin.slice(0, 8));
          '

      - name: Check out the submodule
        if: steps.stale.outputs.stale == 'true'
        run: |
          git submodule update --init vendor/fff
          # The version stamp is a tag reachable from the pin, so the tags have to be there.
          git -C vendor/fff fetch --tags --force

      - uses: oven-sh/setup-bun@v2
        if: steps.stale.outputs.stale == 'true'
        with:
          bun-version: "1.4.2"

      # One bundle, with the native SDK and pi's own runtime left external: `ffi-rs` dlopens the
      # `@ff-labs/fff-bin-*` `.so` at runtime, so the native side can never be inlined. The dynamic
      # SDK imports stay literal in the bundle on purpose (hosts that scan an extension graph find
      # them), which is why both specifiers are listed as externals.
      - name: Build the pi-fff bundle
        if: steps.stale.outputs.stale == 'true'
        run: |
          set -euo pipefail
          bun build vendor/fff/packages/pi-fff/src/index.ts \
            --target=node --format=esm \
            --outfile=packages/pi-fff/index.js \
            --external '@ff-labs/fff-node' \
            --external '@ff-labs/fff-bun' \
            --external '@earendil-works/pi-coding-agent' \
            --external '@earendil-works/pi-tui' \
            --external '@sinclair/typebox'
          cp vendor/fff/packages/pi-fff/pi-fff.schema.json packages/pi-fff/

      # The artifact-level proof that this is the fork and not upstream: without the slot the prebuilt
      # would still build, still test, and silently offer no engine to a cell.
      - name: The prebuilt is the fork
        if: steps.stale.outputs.stale == 'true'
        run: |
          set -euo pipefail
          if ! grep -q 'pi-fff:finder' packages/pi-fff/index.js; then
            echo "::error::the bundle carries no pi-fff:finder slot - is vendor/fff still the fork's branch?"
            exit 1
          fi
          grep -q 'engine-only' packages/pi-fff/index.js
          echo "the engine slot and the engine-only mode are in the bundle"

      # The version is upstream's own rule for a commit that is not a release tag, reimplemented in
      # three lines rather than shelled out to their `scripts/determine-version.lua` (which wants a lua
      # interpreter in the image): bump the patch of `crates/fff-core/Cargo.toml` and suffix the commit.
      # Upstream reads the same file for the same purpose, so this cannot disagree with their npm tags.
      #
      # A release pin is deliberately not expressible here: a GitHub fork advertises **no tags**
      # (`git ls-remote --tags https://github.com/zeroqn/fff` is empty while upstream has 862), so the
      # `describe --exact-match` branch of their rule can never fire against this submodule. The exact
      # commit is in `builtFrom` either way; if we ever pin an upstream release tag, upstream's tags have
      # to be fetched into the submodule first and this rule revisited.
      - name: Stamp the version and submodule commit
        if: steps.stale.outputs.stale == 'true'
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const sub = "vendor/fff";
            const g = (...args) => execFileSync("git", ["-C", sub, ...args], { encoding: "utf8" }).trim();
            const base = fs.readFileSync(sub + "/crates/fff-core/Cargo.toml", "utf8")
              .match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            if (!base) throw new Error("no version in " + sub + "/crates/fff-core/Cargo.toml");
            const [major, minor, patch] = base.split(".").map(Number);
            if ([major, minor, patch].some(Number.isNaN)) throw new Error("unparseable base version " + base);
            const shortCommit = g("rev-parse", "--short", "HEAD");
            const version = major + "." + minor + "." + (patch + 1) + "-nightly." + shortCommit;
            const p = "packages/pi-fff/package.json";
            const pkg = JSON.parse(fs.readFileSync(p, "utf8"));
            pkg.version = version;
            pkg.builtFrom = {
              submodule: sub,
              commit: g("rev-parse", "HEAD"),
              shortCommit,
              upstreamVersion: base,
              fork: "zeroqn/fff#pi",
            };
            fs.writeFileSync(p, JSON.stringify(pkg, null, "\t") + "\n");
            console.log("stamped " + version + " (upstream " + base + " at " + shortCommit + ")");
          '

      - name: Refresh the lockfile
        if: steps.stale.outputs.stale == 'true'
        run: bun install

      - name: Commit if the build changed
        id: commit
        if: steps.stale.outputs.stale == 'true'
        run: |
          set -euo pipefail
          echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- packages/pi-fff bun.lock; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/pi-fff bun.lock
          git commit -m "chore(fff): rebuild the prebuilt plugin

          Built from vendor/fff at $(git -C vendor/fff rev-parse --short HEAD).
          Generated by .github/workflows/fff.yml - do not edit by hand."
          git push
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"

  check:
    needs: prebuilt
    # A skipped rebuild (pull requests have nothing to rebuild into) must not skip the checks; a failed
    # one must not be papered over by a green check.
    if: ${{ needs.prebuilt.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The rebuild landed in a commit of its own. Check that tree, not the pin bump that preceded it.
      - name: Follow the rebuild
        if: needs.prebuilt.outputs.rebuilt == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard FETCH_HEAD
          git log -1 --format='%h %s'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Prebuilt fff is current
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const pkgPath = "packages/pi-fff/package.json";
            const built = read(pkgPath).builtFrom;
            if (!built?.commit) throw new Error(pkgPath + " has no builtFrom.commit");
            // Resolve the pin from the commit rather than from the working tree.
            // actions/checkout leaves vendor/fff as an empty directory unless it is asked for
            // submodules, and `git -C <empty dir> rev-parse HEAD` does not fail there: it walks up to
            // the superproject and answers with this repository HEAD, so the stamp can never match.
            const pin = execFileSync("git", ["rev-parse", "HEAD:vendor/fff"], { encoding: "utf8" }).trim();
            if (built.commit !== pin) {
              throw new Error(
                "packages/pi-fff was built from " + built.commit.slice(0, 8) +
                " but vendor/fff is pinned at " + pin.slice(0, 8) +
                ". The prebuilt job above rebuilds it on push to main, so this means the rebuild " +
                "could not commit - check its log. On a pull request, merging is what triggers the " +
                "rebuild. To rebuild locally: see packages/pi-fff/README.md");
            }
            // The version is a pure function of the stamp, so it is recomputed here rather than
            // trusted - the built directory is generated, and a hand-edit of its version would
            // otherwise be invisible until something reported it to a human.
            const bump = (v) => {
              const [major, minor, patch] = v.split(".").map(Number);
              if ([major, minor, patch].some(Number.isNaN)) throw new Error("unparseable upstreamVersion " + v);
              return major + "." + minor + "." + (patch + 1);
            };
            const want = bump(built.upstreamVersion) + "-nightly." + built.shortCommit;
            if (read(pkgPath).version !== want) {
              throw new Error("prebuilt version " + read(pkgPath).version + " != " + want +
                " (upstream " + built.upstreamVersion + " at " + built.shortCommit + ")");
            }
            console.log("prebuilt fff is current: " + pin.slice(0, 8) + " as " + want);
          '

      - name: Root pi manifest resolves
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const entries = pkg.pi?.extensions ?? [];
            if (!entries.length) throw new Error("no pi.extensions in the root manifest");
            let missing = 0;
            for (const e of entries) {
              const ok = fs.existsSync(path.resolve(e));
              console.log((ok ? "  ok   " : "  MISS ") + e);
              if (!ok) missing++;
            }
            if (missing) throw new Error(missing + " manifest entries do not exist");
            console.log(entries.length + " extensions resolvable");
          '
