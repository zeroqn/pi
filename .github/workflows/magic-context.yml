name: magic-context prebuilt

# Rebuilds packages/magic-context from the vendor/magic-context submodule and
# commits the result back to main. The submodule is the single source of truth;
# this directory is generated.
#
# Pushes with GITHUB_TOKEN, so the repo's Settings -> Actions -> General ->
# Workflow permissions must be "Read and write", and if a ruleset protects main
# it must list the GitHub Actions app as a bypass actor - otherwise the push is
# rejected even though the build succeeded.

on:
  push:
    branches: [main]
    paths:
      - "vendor/magic-context"
      - ".github/workflows/magic-context.yml"
  workflow_dispatch:

concurrency:
  group: magic-context-prebuilt
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # MC's plugin build runs `tsc -p ../retina-local-fs/tsconfig.build.json`,
      # so the workspace install has to exist before the plugin build can run.
      - name: Install the magic-context workspace
        working-directory: vendor/magic-context
        run: bun install

      - name: Build the pi plugin
        working-directory: vendor/magic-context
        run: bun run --cwd packages/pi-plugin build

      - name: Stage the dist into packages/magic-context
        run: |
          set -euo pipefail
          src=vendor/magic-context/packages/pi-plugin/dist
          dest=packages/magic-context
          # Keep the three transformers bundles out of git: their model-class
          # tables trip GitHub push protection (a 32-char identifier beginning
          # "Mistral" reads as an API key). See packages/magic-context/README.md.
          rm -rf "$dest"/index*.js "$dest"/*.js
          for f in "$src"/*.js; do
            case "$(basename "$f")" in
              transformers-web.js|transformers-node-wasm.js|transformers.node-*.js) continue ;;
            esac
            cp "$f" "$dest"/
          done
          # The singlefile quickjs bundle is CJS, and its emscripten wrapper does
          # `typeof __filename < "u" ? _scriptName = __filename : ...`. Bundling it
          # into ESM bakes in the build machine's absolute path, so make the literal
          # relative instead of leaking /home/runner/... (or the builder's checkout)
          # into every user's install. Nothing resolves against it: the wasm is
          # inlined and the node branch of that wrapper uses require("fs").
          sed -i -E 's|__filename = "/[^"]*/(node_modules/\.bun/@jitl\+quickjs-singlefile-cjs-release-asyncify[^"]*)"|__filename = "\1"|' "$dest"/index-*.js
          if grep -rqE '__filename = "/' "$dest" ; then
            echo "::error::an absolute build path survived normalization"
            exit 1
          fi
          echo "staged $(find "$dest" -name '*.js' | wc -l) files"
          ls -la "$dest"

      - name: Guard against secrets reaching git
        run: |
          set -euo pipefail
          if grep -rlE 'Mistral[A-Za-z0-9]{25}' packages/magic-context/ ; then
            echo "::error::a committed file matches the Mistral key shape; refusing to push"
            exit 1
          fi
          echo "clean"

      - name: Stamp the version and submodule commit
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const plugin = read("vendor/magic-context/packages/pi-plugin/package.json");
            const p = "packages/magic-context/package.json";
            const pkg = read(p);
            // Track the plugin version so the prebuilt package states which
            // upstream release it carries. Its own release cadence is the
            // commit stamp, not a number we invent.
            pkg.version = plugin.version;
            pkg.builtFrom = {
              submodule: "vendor/magic-context",
              commit: execFileSync("git", ["-C", "vendor/magic-context", "rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
              pluginVersion: plugin.version,
            };
            fs.writeFileSync(p, JSON.stringify(pkg, null, "\t") + "\n");
            console.log("stamped " + pkg.version + " @ " + pkg.builtFrom.commit.slice(0, 8));
          '

      - name: Refresh the lockfile
        run: bun install

      - name: Commit if the build changed
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/magic-context bun.lock; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/magic-context bun.lock
          git commit -m "chore(magic-context): rebuild the prebuilt plugin

          Built from vendor/magic-context at $(git -C vendor/magic-context rev-parse --short HEAD).
          Generated by .github/workflows/magic-context.yml - do not edit by hand."
          git push
