name: magic-context

# A push that moves vendor/magic-context cannot be checked on its own: the
# prebuilt directory it must match is regenerated by CI into a commit of its own.
# So the rebuild and the checks live in one workflow, and `check` waits for
# `prebuilt` and then reads the tree that was actually rebuilt.
#
# Two workflows cannot express that. A commit pushed with GITHUB_TOKEN does not
# trigger another workflow's `on: push` (only workflow_dispatch and
# repository_dispatch fire), so a separate check workflow would run against the
# pin bump, fail, and never be re-run against the rebuild commit.
#
# The prebuilt job pushes with GITHUB_TOKEN, so the repo's Settings ->
# Actions -> General -> Workflow permissions must be "Read and write", and if a
# ruleset protects main it must list the GitHub Actions app as a bypass actor -
# otherwise the push is rejected even though the build succeeded.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize runs of the same ref: two concurrent pushes to main would otherwise
# both see a stale prebuilt and race to commit it.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Regenerates packages/magic-context from the vendor/magic-context submodule and
  # commits the result back to main. The submodule is the single source of truth;
  # this directory is generated.
  prebuilt:
    # Only main is rebuilt into, and only a push or a dispatch reaches it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      rebuilt: ${{ steps.commit.outputs.rebuilt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pin is read from the commit, not the working tree: actions/checkout
      # leaves vendor/magic-context as an empty directory, and `git -C <empty
      # dir> rev-parse HEAD` does not fail there - it walks up to the
      # superproject and answers with this repository HEAD.
      - name: Is the prebuilt stale?
        id: stale
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const stamp = read("packages/magic-context/package.json").builtFrom?.commit;
            const pin = execFileSync("git", ["rev-parse", "HEAD:vendor/magic-context"], { encoding: "utf8" }).trim();
            const stale = stamp !== pin;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "stale=" + stale + "\n");
            console.log(stale
              ? "stale: built from " + String(stamp).slice(0, 8) + ", pinned at " + pin.slice(0, 8)
              : "current: prebuilt package matches submodule " + pin.slice(0, 8));
          '

      - name: Check out the submodule
        if: steps.stale.outputs.stale == 'true'
        run: git submodule update --init --recursive

      - uses: oven-sh/setup-bun@v2
        if: steps.stale.outputs.stale == 'true'
        with:
          bun-version: "1.4.2"

      # MC's plugin build runs `tsc -p ../retina-local-fs/tsconfig.build.json`,
      # so the workspace install has to exist before the plugin build can run.
      - name: Install the magic-context workspace
        if: steps.stale.outputs.stale == 'true'
        working-directory: vendor/magic-context
        run: bun install

      - name: Build the pi plugin
        if: steps.stale.outputs.stale == 'true'
        working-directory: vendor/magic-context
        run: bun run --cwd packages/pi-plugin build

      - name: Stage the dist into packages/magic-context
        if: steps.stale.outputs.stale == 'true'
        run: |
          set -euo pipefail
          src=vendor/magic-context/packages/pi-plugin/dist
          dest=packages/magic-context
          # Keep the three transformers bundles out of git: their model-class
          # tables trip GitHub push protection (a 32-char identifier beginning
          # "Mistral" reads as an API key). See packages/magic-context/README.md.
          rm -rf "$dest"/index*.js "$dest"/*.js
          for f in "$src"/*.js; do
            case "$(basename "$f")" in
              transformers-web.js|transformers-node-wasm.js|transformers.node-*.js) continue ;;
            esac
            cp "$f" "$dest"/
          done
          # The singlefile quickjs bundle is CJS, and its emscripten wrapper does
          # `typeof __filename < "u" ? _scriptName = __filename : ...`. Bundling it
          # into ESM bakes in the build machine's absolute path, so make the literal
          # relative instead of leaking /home/runner/... (or the builder's checkout)
          # into every user's install. Nothing resolves against it: the wasm is
          # inlined and the node branch of that wrapper uses require("fs").
          sed -i -E 's|__filename = "/[^"]*/(node_modules/\.bun/@jitl\+quickjs-singlefile-cjs-release-asyncify[^"]*)"|__filename = "\1"|' "$dest"/index-*.js
          if grep -rqE '__filename = "/' "$dest" ; then
            echo "::error::an absolute build path survived normalization"
            exit 1
          fi
          echo "staged $(find "$dest" -name '*.js' | wc -l) files"
          ls -la "$dest"

      - name: Guard against secrets reaching git
        if: steps.stale.outputs.stale == 'true'
        run: |
          set -euo pipefail
          if grep -rlE 'Mistral[A-Za-z0-9]{25}' packages/magic-context/ ; then
            echo "::error::a committed file matches the Mistral key shape; refusing to push"
            exit 1
          fi
          echo "clean"

      - name: Stamp the version and submodule commit
        if: steps.stale.outputs.stale == 'true'
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const plugin = read("vendor/magic-context/packages/pi-plugin/package.json");
            const p = "packages/magic-context/package.json";
            const pkg = read(p);
            // Track the plugin version so the prebuilt package states which
            // upstream release it carries. Its own release cadence is the
            // commit stamp, not a number we invent.
            pkg.version = plugin.version;
            pkg.builtFrom = {
              submodule: "vendor/magic-context",
              commit: execFileSync("git", ["-C", "vendor/magic-context", "rev-parse", "HEAD"], { encoding: "utf8" }).trim(),
              pluginVersion: plugin.version,
            };
            fs.writeFileSync(p, JSON.stringify(pkg, null, "\t") + "\n");
            console.log("stamped " + pkg.version + " @ " + pkg.builtFrom.commit.slice(0, 8));
          '

      - name: Refresh the lockfile
        if: steps.stale.outputs.stale == 'true'
        run: bun install

      - name: Commit if the build changed
        id: commit
        if: steps.stale.outputs.stale == 'true'
        run: |
          set -euo pipefail
          echo "rebuilt=false" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- packages/magic-context bun.lock; then
            echo "no change; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/magic-context bun.lock
          git commit -m "chore(magic-context): rebuild the prebuilt plugin

          Built from vendor/magic-context at $(git -C vendor/magic-context rev-parse --short HEAD).
          Generated by .github/workflows/check.yml - do not edit by hand."
          git push
          echo "rebuilt=true" >> "$GITHUB_OUTPUT"

  check:
    needs: prebuilt
    # A skipped rebuild (pull requests have nothing to rebuild into) must not skip
    # the checks; a failed one must not be papered over by a green check.
    if: ${{ needs.prebuilt.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The rebuild landed in a commit of its own. Check that tree, not the pin
      # bump that preceded it.
      - name: Follow the rebuild
        if: needs.prebuilt.outputs.rebuilt == 'true'
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard FETCH_HEAD
          git log -1 --format='%h %s'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install

      - name: Tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Prebuilt magic-context is current
        run: |
          node -e '
            const { execFileSync } = require("node:child_process");
            const fs = require("node:fs");
            const read = (p) => JSON.parse(fs.readFileSync(p, "utf8"));
            const pkgPath = "packages/magic-context/package.json";
            const stamp = read(pkgPath).builtFrom?.commit;
            if (!stamp) throw new Error(pkgPath + " has no builtFrom.commit");
            // Resolve the pin from the commit rather than from the working tree.
            // actions/checkout leaves vendor/magic-context as an empty directory
            // unless it is asked for submodules, and `git -C <empty dir> rev-parse
            // HEAD` does not fail there: it walks up to the superproject and
            // answers with this repository HEAD, so the stamp can never match.
            const pin = execFileSync("git", ["rev-parse", "HEAD:vendor/magic-context"], { encoding: "utf8" }).trim();
            const pluginPkg = "vendor/magic-context/packages/pi-plugin/package.json";
            if (fs.existsSync(pluginPkg)) {
              const want = read(pluginPkg).version;
              const got = read(pkgPath).version;
              if (want !== got) throw new Error("prebuilt package version " + got + " != plugin version " + want);
            }
            if (stamp !== pin) {
              throw new Error(
                "packages/magic-context was built from " + stamp.slice(0, 8) +
                " but vendor/magic-context is pinned at " + pin.slice(0, 8) +
                ". The prebuilt job above rebuilds it on push to main, so this " +
                "means the rebuild could not commit - check its log. On a pull " +
                "request, merging is what triggers the rebuild. To rebuild " +
                "locally: bun run --cwd vendor/magic-context/packages/pi-plugin build");
            }
            console.log("prebuilt package matches submodule " + pin.slice(0, 8));
          '

      - name: Root pi manifest resolves
        run: |
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const entries = pkg.pi?.extensions ?? [];
            if (!entries.length) throw new Error("no pi.extensions in the root manifest");
            let missing = 0;
            for (const e of entries) {
              const ok = fs.existsSync(path.resolve(e));
              console.log((ok ? "  ok   " : "  MISS ") + e);
              if (!ok) missing++;
            }
            if (missing) throw new Error(missing + " manifest entries do not exist");
            console.log(entries.length + " extensions resolvable");
          '
